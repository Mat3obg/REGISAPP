<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REGISAPP - Gestión Financiera</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Iconos de FontAwesome para botones bonitos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Menú Inferior (Navegación Principal) -->
    <div id="app">
        <!-- Contenido Principal -->
        <div id="main-content">
            <!-- Aquí se cargarán los diferentes componentes -->
        </div>

        <!-- Menú de Navegación Inferior -->
        <nav id="bottom-nav">
            <div class="nav-item active" data-component="dashboard">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </div>
            <div class="nav-item" data-component="operaciones">
                <i class="fas fa-exchange-alt"></i>
                <span>Operaciones</span>
            </div>
            <div class="nav-item" data-component="gastosFijos">
                <i class="fas fa-credit-card"></i>
                <span>Gastos Fijos</span>
            </div>
            <div class="nav-item" data-component="deberes">
                <i class="fas fa-hand-holding-usd"></i>
                <span>Deberes</span>
            </div>
            <div class="nav-item" data-component="mantenimiento">
                <i class="fas fa-car"></i>
                <span>Mantenimiento</span>
            </div>
        </nav>
    </div>

    <!-- Cargar JavaScript -->
    <script src="js/database.js"></script>
    <script src="js/components/dashboard.js"></script>
    <script src="js/components/operaciones.js"></script>
    <script src="js/components/gastosFijos.js"></script>
    <script src="js/components/deberes.js"></script>
    <script src="js/components/mantenimiento.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
